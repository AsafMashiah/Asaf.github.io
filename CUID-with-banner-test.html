<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
  // Queue — buffers AF() calls until the SDK is ready
  window.AppsFlyerSdkObject = "AF";
  window.AF = window.AF || function() {
    (window.AF.q = window.AF.q || []).push([Date.now()].concat(Array.prototype.slice.call(arguments)));
  };
  window.AF.id = window.AF.id || {
    pba: { webAppId: "35f7769a-49c6-458f-aa26-4cb9e19ccac9" },
    banners: { key: "89b09d9f-e81f-4e3a-afbf-fe74f74db8e8" }
  };
  window.AF.plugins = {};

  // Inject SDK
  var o = document.createElement("script"),
      p = document.getElementsByTagName("script")[0];
  o.async = 1;
  o.src = "https://websdk.appsflyersdk.com?" + "st=pba,banners&af_id=35f7769a-49c6-458f-aa26-4cb9e19ccac9";
  p.parentNode.insertBefore(o, p);

  

  // Set the Customer User ID (CUID) — replace with the actual logged-in user's ID
  AF('pba', 'setCustomerUserId', '123456');
</script>
</head>
<body>

<p>asaf test</p>
  
<script> 
function getCookie(name) {
  const value = `; ${document.cookie}`;
  const parts = value.split(`; ${name}=`);
  if (parts.length === 2) return parts.pop().split(';').shift();
  return null;
}

function waitForAfUserId(callback, timeoutMs = 3000, intervalMs = 100) {
  const start = Date.now();

  const check = () => {
    const afUserId = getCookie('afUserId');
    if (afUserId) {
      callback(afUserId);
      return;
    }
    if (Date.now() - start >= timeoutMs) {
      callback(null); // give up, proceed without it
      return;
    }
    setTimeout(check, intervalMs);
  };

  check();
}

// Usage
waitForAfUserId(function (afUserId) {
  AF('banners', 'showBanner', {
    additionalParams: {
      af_user_id: afUserId // may be null if it never appeared in time
    }
  });
});

</script>

</body>


  
</html>
